<!--
  Taskrabbit Tasker quiz (moving categories): blog embed
  Hosted at https://trseo.github.io/taskrabbit-moving/taskers/
  1. Set ?market= to en-US or en-GB. Optionally change utm_campaign per post.
  2. Bump v= (e.g. v=2) whenever taskers/index.html changes.
  3. Paste everything below into the post (HTML / custom code block).
  Works on the same page as the client calculator: it uses its own id and message source.
-->
<div style="max-width:720px;margin:32px auto;">
  <iframe
    id="tr-tasker-quiz"
    src="https://trseo.github.io/taskrabbit-moving/taskers/?market=en-US&v=1&utm_campaign=tasker_moving_quiz"
    title="Find your moving categories as a Tasker"
    loading="lazy"
    allow="clipboard-write"
    scrolling="no"
    style="display:block;width:100%;min-height:520px;border:0;overflow:hidden;">
  </iframe>
</div>
<script>
(function () {
  var frame = document.getElementById('tr-tasker-quiz');
  if (!frame) return;
  var origin = new URL(frame.src).origin;
  window.addEventListener('message', function (e) {
    if (e.origin !== origin) return;
    var d = e.data;
    if (!d || d.source !== 'tr-tasker-quiz') return;
    if (d.type === 'resize' && d.height) frame.style.height = d.height + 'px';
    if (d.type === 'step') {
      var top = frame.getBoundingClientRect().top;
      if (top < 0) window.scrollBy({ top: top - 80, behavior: 'smooth' });
    }
    // Analytics: tasker_quiz_start, tasker_quiz_step_view, tasker_quiz_complete,
    // tasker_quiz_signup_click, tasker_quiz_copy_list, tasker_quiz_restart
    if (d.type === 'event') {
      window.dataLayer = window.dataLayer || [];
      var evt = { event: 'tasker_quiz_' + d.name };
      for (var k in d.payload) evt['tasker_quiz_' + k] = d.payload[k];
      window.dataLayer.push(evt);
    }
  });
})();
</script>
