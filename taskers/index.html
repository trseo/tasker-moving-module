<!DOCTYPE html>
<!-- Taskrabbit Tasker moving-categories quiz v1 -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Find your moving categories | Taskrabbit</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* =========================================================
   THEME — Taskrabbit Brand Guidelines (Oct 2023)
   Primary: Agave, Monstera, Pampas, Lily. Secondary colours
   are used sparingly and never outweigh the primaries.
   Type: Inter. Letter spacing 0%. Line height 100–130%.
   ========================================================= */
:root{
  --agave:#0D7A5F;      /* primary brand green */
  --agave-dark:#0A644E; /* hover state, darker Agave */
  --monstera:#0A2B14;   /* text and dark surfaces */
  --pampas:#FFFCE4;     /* light surfaces, text on Agave */
  --lily:#FFFFFF;       /* page background */
  --teal:#65CCB2;       /* secondary, accents only */
  --ink-soft:rgba(10,43,20,.74);
  --line:rgba(10,43,20,.14);
  --radius-lg:20px;
  --radius-md:14px;
  --font:"Inter", system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}
*{box-sizing:border-box;letter-spacing:0}
html,body{margin:0;padding:0;background:transparent}
body{font-family:var(--font);font-weight:400;color:var(--monstera);font-size:16px;line-height:1.3;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
.app{max-width:720px;margin:0 auto;padding:28px 24px 28px;background:var(--lily);border:1px solid var(--line);border-radius:var(--radius-lg)}

/* ---------- Progress: a row of boxes that get packed ---------- */
.progress{display:flex;gap:8px;align-items:flex-end;margin:0 0 24px}
.box{position:relative;flex:1;max-width:44px;height:30px;border:2px dashed rgba(13,122,95,.4);border-radius:5px;transition:background-color .25s ease,border-color .25s ease,transform .25s ease}
.box.packed{background:var(--agave);border:2px solid var(--agave);transform:translateY(-2px)}
.box.packed::after{content:"";position:absolute;left:50%;top:-2px;bottom:-2px;width:8px;margin-left:-4px;background:var(--pampas)}
.box.current{border:2px solid var(--agave)}
.progress-label{margin-left:auto;font-size:14px;color:var(--ink-soft);white-space:nowrap;padding-left:8px}

/* ---------- Question ---------- */
.q-title{font-size:clamp(24px,4.4vw,30px);line-height:1.15;font-weight:700;margin:0 0 8px;outline:none}
.q-hint{color:var(--ink-soft);margin:0 0 20px;line-height:1.3}
.q-hint.sr-only + .options{margin-top:20px}
.options{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.opt{display:flex;align-items:center;gap:12px;text-align:left;width:100%;min-height:60px;padding:14px 16px;background:var(--pampas);border:2px solid transparent;border-radius:var(--radius-md);cursor:pointer;font-weight:600;line-height:1.25;color:var(--monstera)}
.opt:hover{border-color:var(--agave)}
.opt[aria-pressed="true"]{background:var(--agave);border-color:var(--agave);color:var(--pampas)}
.opt .mark{flex:none;width:22px;height:22px;border-radius:50%;border:2px solid var(--agave);display:grid;place-items:center;background:var(--lily)}
.opt.multi .mark{border-radius:6px}
.opt[aria-pressed="true"] .mark{border-color:var(--pampas);background:var(--pampas)}
.opt[aria-pressed="true"] .mark::after{content:"";width:6px;height:10px;border:solid var(--agave);border-width:0 2.5px 2.5px 0;transform:translateY(-1px) rotate(45deg)}
.opt .sub{display:block;font-weight:400;font-size:14px;color:var(--ink-soft);margin-top:2px}
.opt[aria-pressed="true"] .sub{color:var(--pampas)}

/* ---------- Nav + buttons ---------- */
.nav{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px;margin-top:24px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 24px;border-radius:999px;border:0;cursor:pointer;font-weight:700;text-decoration:none;line-height:1}
.btn-primary{background:var(--agave);color:var(--pampas)}
.btn-primary:hover{background:var(--agave-dark)}
.btn-primary:disabled{background:var(--line);color:var(--ink-soft);cursor:not-allowed}
.btn-light{background:var(--pampas);color:var(--monstera)}
.btn-light:hover{background:var(--lily)}
.btn-ghost{background:transparent;color:var(--agave);padding:0 6px}
.btn-ghost:hover{color:var(--monstera)}
:focus-visible{outline:3px solid var(--monstera);outline-offset:2px}

/* ---------- Results ---------- */
.r-intro{color:var(--ink-soft);margin:0 0 16px}
.match{position:relative;overflow:hidden;background:var(--agave);color:var(--pampas);border-radius:var(--radius-lg);padding:26px 24px 24px;margin-bottom:24px}
/* Secondary shape: a small dot grid, used once and sparingly */
.match::before{content:"";position:absolute;top:18px;right:18px;width:70px;height:42px;background-image:radial-gradient(circle,var(--pampas) 2.2px,transparent 2.7px);background-size:14px 14px;opacity:.6;pointer-events:none}
.match-tag{display:inline-block;font-size:14px;font-weight:600;color:var(--monstera);background:var(--teal);padding:4px 12px;border-radius:999px;margin-bottom:12px}
.match h3{font-size:clamp(26px,4.8vw,34px);line-height:1.1;margin:0 0 8px;font-weight:700;max-width:16ch}
.match p{margin:0 0 18px;max-width:56ch;line-height:1.3}
.estimates{display:grid;gap:8px;margin:0 0 20px;padding:0;list-style:none}
.est{display:flex;gap:14px;align-items:baseline;flex-wrap:wrap;padding:12px 14px;background:rgba(10,43,20,.28);border-radius:var(--radius-md)}
.est strong{font-size:20px;font-weight:700;white-space:nowrap}
.est span{font-size:15px;line-height:1.3}
.addons h4{font-size:19px;font-weight:600;margin:0 0 10px}
.addon{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:14px 0;border-top:1px solid var(--line)}
.addon:last-child{border-bottom:1px solid var(--line)}
.addon b{display:block;font-weight:600}
.addon small{display:block;color:var(--ink-soft);font-size:14px;line-height:1.3;margin-top:2px}
.addon a{flex:none;font-weight:700;color:var(--agave);text-decoration:none;padding:10px 4px}
.addon a:hover{color:var(--monstera);text-decoration:underline}
.nav-right{display:flex;align-items:center;gap:10px;margin-left:auto}
/* Neutral grey for Start Over (not a brand colour; kept quiet so the green stays dominant) */
.btn-gray{background:#E4E7E5;color:var(--monstera)}
.btn-gray:hover{background:#D3D8D5}
.btn-outline{background:transparent;color:var(--agave);border:2px solid var(--agave)}
.btn-outline:hover{background:var(--agave);color:var(--pampas)}
.btn-outline-light{background:transparent;color:var(--pampas);border:2px solid var(--pampas)}
.btn-outline-light:hover{background:var(--pampas);color:var(--monstera)}
.est{margin:0 0 18px}
.desc{margin:0 0 18px}
.match .desc{margin-bottom:0}
.actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.desc label{display:block;font-weight:600;margin-bottom:8px}
.desc textarea{display:block;width:100%;min-height:104px;padding:12px 14px;border-radius:var(--radius-md);border:2px solid var(--line);background:var(--lily);color:var(--monstera);font:inherit;font-size:15px;line-height:1.3;resize:vertical}
.desc.on-dark textarea{border-color:transparent;background:var(--pampas)}
.desc-hint{font-size:14px;margin:8px 0 12px;color:var(--ink-soft)}
.desc.on-dark .desc-hint{color:var(--pampas);opacity:.9}
.addon{display:block}
.addon-row{display:flex;justify-content:space-between;align-items:center;gap:14px}
.addon details{margin-top:6px}
.addon summary{cursor:pointer;color:var(--agave);font-weight:600;font-size:15px;padding:6px 0;width:max-content}
.addon summary:hover{color:var(--monstera)}
.addon details[open] .desc{margin-top:10px;margin-bottom:6px}
.notes{margin:20px 0 0;padding:14px 16px;list-style:none;font-size:15px;background:var(--pampas);border-radius:var(--radius-md)}
.notes li+li{margin-top:8px}
.fine{font-size:13px;color:var(--ink-soft);margin:16px 0 0;line-height:1.3}

@media (max-width:480px){
  .app{padding:20px 16px 22px;border-radius:16px}
  .options{grid-template-columns:1fr}
  .addon-row{flex-direction:column;align-items:flex-start;gap:4px}
  .match::before{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- Tasker results ---------- */
.cats{display:grid;gap:10px;margin:0 0 20px;padding:0;list-style:none}
.cat{padding:16px 18px;background:var(--pampas);border-radius:var(--radius-md)}
.cat b{display:block;font-weight:600;font-size:17px}
.cat p{margin:4px 0 0;font-size:15px;line-height:1.3}
.cat .why{margin-top:8px;font-size:14px;color:var(--ink-soft)}
.match .perks{margin:0 0 20px;padding:0;list-style:none;display:grid;gap:6px}
.match .perks li{padding-left:22px;position:relative;line-height:1.3}
.match .perks li::before{content:"";position:absolute;left:2px;top:4px;width:6px;height:10px;border:solid var(--pampas);border-width:0 2.5px 2.5px 0;transform:rotate(45deg)}
.steps{margin:0 0 20px;padding:16px 18px 16px 38px;background:rgba(10,43,20,.28);border-radius:var(--radius-md);line-height:1.3}
.steps li+li{margin-top:6px}
.secondary-cta{margin:20px 0 4px}
</style>
</head>
<body>
<main class="app" id="app" aria-live="polite"></main>

<script>
/* =========================================================
   CONFIG — everything you'll want to edit lives here.
   Copy follows the Taskrabbit Brand Guidelines legal guidance:

   no required tools, no promised earnings or outcomes.

var CONFIG = {
  version: "1",
  defaultMarket: "en-US",
  utm: { utm_source: "taskrabbit_blog", utm_medium: "embedded_tool", utm_campaign: "tasker_moving_quiz" },

        truck_assisted: { name: "Man with a Van",       blurb: "Use your vehicle to help people load, transport, and unload their things.", note: "One of the most in-demand moving categories, especially at the start and end of the month." },
        help_moving:    { name: "Help Moving",          blurb: "Help people load, carry, and unload. They provide the van." },
        lift_shift:     { name: "Heavy Lifting",        blurb: "Be the extra pair of hands for big, awkward items." },
        junk_removal:   { name: "Rubbish Removal",      blurb: "Help people clear out what isn’t making the move." },
        delivery:       { name: "Delivery",             blurb: "Pick up and drop off items, from a new sofa to a storage run." },
        packing:        { name: "Packing & Unpacking",  blurb: "Help people box up before a move or settle in after." },
        assembly:       { name: "Furniture Assembly",   blurb: "Take apart and rebuild beds, wardrobes, and shelves on moving day." },
        mounting:       { name: "TV Mounting",          blurb: "Help people get TVs, shelves, and pictures up at their new place." },

      },
      overrides: {
        "vehicle.pickup": "Pickup",
        "vehicle.van": "Van",
        "vehicle.van.sub": "Small or large",
        "vehicle.box": "Luton van",
        "vehicle.car": "Car or estate",
        "help_with.packing": "Packing and organising"
      }
    }
  },
  copy: {
    resultsTitleNew: "Moving categories that fit your setup",
    resultsTitleTasker: "Moving categories to add next",
    introNew: "Help Moving is one of Taskrabbit’s biggest task categories. Here’s where your vehicle, gear, and interests line up.",
    introTasker: "Based on your vehicle, gear, and interests, these are worth adding to your profile.",
    topPick: "Top pick",
    alsoFits: "Also a good fit",
    fitsBecause: "Why it fits: ",
    perks: ["Choose your tasks, schedule, and work area", "Set your own rates and keep 100% of them, plus tips", "Get invites for tasks in the categories you pick"],
    stepsTitle: "How to add these",
    steps: ["Open the Tasker app", "Go to the Performance tab, then Skills & Rates", "Add the categories on this page and set your rates"],
    ctaNew: "Become a Tasker",
    copyList: "Copy Category List",
    copied: "Copied",
    restart: "Start Over",
    back: "Back",
    next: "Continue",
    notePeak: "Moving demand often peaks at the start and end of each month, so keeping your availability up to date around those dates can help you get more invites.",
    noteNoGear: "No gear yet? That’s fine. You decide what to bring to each task, and plenty of moving tasks are mostly about an extra pair of hands.",
    noteLight: "Prefer lighter work? Packing, assembly, mounting, and cleaning are all part of moving day, too.",
    fine: "Taskers are independent and choose their own tasks, schedule, and rates. Signing up includes an identity check and a background check. Category availability varies by city.",
    fineTasker: "Taskers are independent and choose their own tasks, schedule, and rates. Category availability varies by city."
  }
};

/* =========================================================
   QUESTIONS — score adds points to categories; tag is how the
   answer reads in "Fits because of…". Negative scores push a
   category down.
   ========================================================= */
var QUESTIONS = [
  { id: "status", type: "single", title: "Are you a Tasker already?",
    options: [
      { id: "tasker", label: "Yes, I’m a Tasker" },
      { id: "new",    label: "Not yet" }
    ] },
  { id: "vehicle", type: "single", title: "What vehicle do you have access to?",
    options: [
      { id: "pickup", label: "Pickup truck", tag: "your pickup",       score: { truck_assisted: 8, junk_removal: 5, delivery: 4, help_moving: 2 } },
      { id: "van",    label: "Cargo van or minivan", tag: "your van",  score: { truck_assisted: 7, delivery: 5, junk_removal: 4, help_moving: 2 } },
      { id: "box",    label: "Box truck", tag: "your box truck",       score: { truck_assisted: 9, junk_removal: 5, delivery: 3 } },
      { id: "car",    label: "Car or SUV", tag: "your car",            score: { delivery: 3, help_moving: 2, packing: 1 } },
      { id: "none",   label: "No vehicle",                              score: { help_moving: 3, packing: 2, lift_shift: 1 } }
    ] },
  { id: "gear", type: "multi", title: "What gear do you have?", hint: "Pick all that apply. None is fine, too.",
    options: [
      { id: "dolly",    label: "Dolly or hand truck",          tag: "your dolly",          score: { help_moving: 2, lift_shift: 2, truck_assisted: 1, junk_removal: 1 } },
      { id: "blankets", label: "Moving blankets and straps",   tag: "your blankets and straps", score: { truck_assisted: 2, help_moving: 2, delivery: 1 } },
      { id: "sliders",  label: "Furniture sliders",            tag: "your sliders",        score: { lift_shift: 2, help_moving: 1 } },
      { id: "tools",    label: "Basic tool kit", sub: "Drill, screwdrivers, Allen keys", tag: "your tool kit", score: { assembly: 5, mounting: 1 } },
      { id: "level",    label: "Level and stud finder",        tag: "your level and stud finder", score: { mounting: 5 } },
      { id: "clean",    label: "Cleaning supplies",            tag: "your cleaning supplies", score: { cleaning: 5 } },
      { id: "none",     label: "None yet", exclusive: true }
    ] },
  { id: "help_with", type: "multi", title: "What kind of work do you enjoy?", hint: "Pick all that apply.",
    options: [
      { id: "lifting",  label: "Lifting and carrying",   tag: "you enjoy lifting and carrying",  score: { help_moving: 4, lift_shift: 4, truck_assisted: 2 } },
      { id: "packing",  label: "Packing and organizing", tag: "you enjoy packing",  score: { packing: 5 } },
      { id: "building", label: "Building furniture",     tag: "you enjoy building furniture", score: { assembly: 4 } },
      { id: "mounting", label: "Mounting and hanging",   tag: "you enjoy mounting and hanging", score: { mounting: 4 } },
      { id: "cleaning", label: "Cleaning",               tag: "you enjoy cleaning", score: { cleaning: 4 } },
      { id: "hauling",  label: "Hauling things away",    tag: "you enjoy hauling things away",  score: { junk_removal: 4, truck_assisted: 1, delivery: 1 } }
    ] },
  { id: "lifting", type: "single", title: "How do you feel about heavy lifting?",
    options: [
      { id: "love",     label: "Bring on the sofas",       tag: "you’re up for heavy lifting", score: { help_moving: 2, lift_shift: 3, truck_assisted: 1 } },
      { id: "moderate", label: "Happy to, in moderation" },
      { id: "skip",     label: "I’d rather skip it",       score: { help_moving: -5, lift_shift: -7, truck_assisted: -4, junk_removal: -2, packing: 2, cleaning: 1 } }
    ] },
  { id: "when", type: "multi", title: "When do you like to task?", hint: "Pick all that apply. You can change this anytime.",
    options: [
      { id: "weekdays", label: "Weekdays" },
      { id: "evenings", label: "Evenings" },
      { id: "weekends", label: "Weekends" },
      { id: "monthend", label: "Around the start and end of the month", sub: "When lots of people move" }
    ] }
];

/* =========================================================
   APP
   ========================================================= */
(function(){
  var params = new URLSearchParams(location.search);
  var marketKey = CONFIG.markets[params.get("market")] ? params.get("market") : CONFIG.defaultMarket;
  var M = CONFIG.markets[marketKey];
  var C = CONFIG.copy;
  document.documentElement.lang = marketKey;

  var answers = {}, history = [], current = 0, started = false;
  var app = document.getElementById("app");

  function post(msg){ msg.source = "tr-tasker-quiz"; try { if (window.parent !== window) window.parent.postMessage(msg, "*"); } catch(e){} }
  function track(name, payload){ post({ type: "event", name: name, payload: payload || {} }); }
  function reportHeight(){ post({ type: "resize", height: Math.ceil(document.documentElement.scrollHeight) }); }
  if ("ResizeObserver" in window) new ResizeObserver(reportHeight).observe(document.body);
  window.addEventListener("load", reportHeight);

  function t(key, fallback){ return M.overrides[key] || fallback; }
  function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }
  function visible(){ return QUESTIONS.map(function(q,i){ return i; }).filter(function(i){ var q = QUESTIONS[i]; return !q.showIf || q.showIf(answers); }); }
  function nextIndex(from){ for (var i = from + 1; i < QUESTIONS.length; i++){ var q = QUESTIONS[i]; if (!q.showIf || q.showIf(answers)) return i; } return -1; }
  function opt(q, id){ return q.options.filter(function(o){ return o.id === id; })[0]; }
  function chosen(q){ var a = answers[q.id]; if (a == null) return []; return (Array.isArray(a) ? a : [a]).map(function(id){ return opt(q, id); }).filter(Boolean); }
  function listJoin(a){ return a.length < 3 ? a.join(" and ") : a.slice(0, -1).join(", ") + ", and " + a[a.length - 1]; }
  function isNew(){ return answers.status !== "tasker"; }

  function signupLink(slot){
    var u = new URL(M.signupUrl);
    Object.keys(CONFIG.utm).forEach(function(k){ u.searchParams.set(k, params.get(k) || CONFIG.utm[k]); });
    u.searchParams.set("utm_content", slot);
    return u.toString();
  }

  /* ---- progress ---- */
  function progressHTML(){
    var v = visible(), pos = v.indexOf(current), html = "";
    v.forEach(function(qi, n){
      var answered = answers[QUESTIONS[qi].id] != null && n < pos;
      html += '<span class="box' + (answered ? " packed" : "") + (n === pos ? " current" : "") + '" aria-hidden="true"></span>';
    });
    return '<div class="progress">' + html + '<span class="progress-label">Question ' + (pos + 1) + " of " + v.length + "</span></div>";
  }

  /* ---- question screen ---- */
  function renderQuestion(){
    var q = QUESTIONS[current], multi = q.type === "multi", sel = answers[q.id];
    var html = progressHTML();
    html += '<h2 class="q-title" tabindex="-1">' + esc(t(q.id, q.id === "vehicle" && M.vehicleQuestion ? M.vehicleQuestion : q.title)) + "</h2>";
    if (q.hint) html += '<p class="q-hint">' + esc(t(q.id + ".hint", q.hint)) + "</p>"; else html += '<p class="q-hint sr-only">Choose one.</p>';
    html += '<div class="options" role="group" aria-label="' + esc(q.title) + '">';
    q.options.forEach(function(o){
      var on = multi ? (sel || []).indexOf(o.id) > -1 : sel === o.id;
      var sub = t(q.id + "." + o.id + ".sub", o.sub || "");
      html += '<button type="button" class="opt' + (multi ? " multi" : "") + '" data-id="' + o.id + '" aria-pressed="' + on + '">' +
              '<span class="mark" aria-hidden="true"></span><span>' + esc(t(q.id + "." + o.id, o.label)) +
              (sub ? '<span class="sub">' + esc(sub) + "</span>" : "") + "</span></button>";
    });
    html += "</div>";
    var backBtn = '<button type="button" class="btn btn-primary" data-act="back">← ' + C.back + "</button>";
    var restartBtn = '<button type="button" class="btn btn-gray" data-act="restart">' + C.restart + "</button>";
    var nextBtn = multi ? '<button type="button" class="btn btn-primary" data-act="next"' + ((sel && sel.length) ? "" : " disabled") + ">" + C.next + "</button>" : "";
    if (history.length || multi){
      html += '<div class="nav">' + (history.length ? backBtn : "<span></span>") + '<div class="nav-right">' + (history.length ? restartBtn : "") + nextBtn + "</div></div>";
    }
    app.innerHTML = html;
    var h = app.querySelector(".q-title"); if (h && started) h.focus({ preventScroll: true });
    track("step_view", { step: q.id, market: marketKey });
  }

  function choose(id){
    var q = QUESTIONS[current];
    if (!started){ started = true; track("start", { market: marketKey }); }
    if (q.type === "single"){ answers[q.id] = id; advance(); return; }
    var o = opt(q, id), list = (answers[q.id] || []).slice(), i = list.indexOf(id);
    if (i > -1) list.splice(i, 1);
    else if (o.exclusive) list = [id];
    else { list = list.filter(function(x){ return !opt(q, x).exclusive; }); list.push(id); }
    answers[q.id] = list;
    renderQuestion();
    var btn = app.querySelector('[data-id="' + id + '"]'); if (btn) btn.focus();
  }
  function advance(){
    var n = nextIndex(current); history.push(current);
    if (n === -1) renderResults(); else { current = n; renderQuestion(); }
    post({ type: "step" });
  }
  function back(){ if (!history.length) return; current = history.pop(); renderQuestion(); post({ type: "step" }); }
  function restart(){ answers = {}; history = []; current = 0; started = false; track("restart", { market: marketKey }); renderQuestion(); post({ type: "step" }); }

  /* ---- scoring, with the reasons behind each score ---- */
  function score(){
    var s = {}, why = {};
    Object.keys(M.categories).forEach(function(k){ s[k] = 0; why[k] = []; });
    QUESTIONS.forEach(function(q){ chosen(q).forEach(function(o){
      if (!o.score) return;
      Object.keys(o.score).forEach(function(k){
        s[k] += o.score[k];
        if (o.score[k] >= 2 && o.tag && why[k].indexOf(o.tag) === -1 && why[k].length < 3) why[k].push(o.tag);
      });
    }); });
    return Object.keys(s).filter(function(k){ return s[k] >= 4; })
      .sort(function(a,b){ return s[b] - s[a]; })
      .map(function(k){ return { key: k, pts: s[k], why: why[k] }; });
  }

  /* ---- results screen ---- */
  function renderResults(){
    var ranked = score();
    if (!ranked.length) ranked = [{ key: "help_moving", pts: 1, why: [] }, { key: "packing", pts: 1, why: [] }];
    var top = ranked[0], rest = ranked.slice(1, 6);
    var T = M.categories[top.key], fresh = isNew();
    var notes = [];
    if ((answers.when || []).indexOf("monthend") > -1 || ["truck_assisted","help_moving"].indexOf(top.key) > -1) notes.push(C.notePeak);
    if ((answers.gear || []).indexOf("none") > -1) notes.push(C.noteNoGear);
    if (answers.lifting === "skip") notes.push(C.noteLight);

    var html = '<h2 class="q-title" tabindex="-1">' + (fresh ? C.resultsTitleNew : C.resultsTitleTasker) + "</h2>";
    html += '<p class="r-intro">' + (fresh ? C.introNew : C.introTasker) + "</p>";
    html += '<section class="match"><span class="match-tag">' + C.topPick + "</span><h3>" + esc(T.name) + "</h3><p>" + esc(T.blurb) + (T.note ? " " + esc(T.note) : "") + "</p>";
    if (top.why.length) html += '<p class="why-top">' + C.fitsBecause + esc(listJoin(top.why)) + ".</p>";
    if (fresh){
      html += '<ul class="perks">' + C.perks.map(function(p){ return "<li>" + p + "</li>"; }).join("") + "</ul>";
      html += '<a class="btn btn-light" target="_top" rel="noopener" data-cta="signup" href="' + signupLink("top_" + top.key) + '">' + C.ctaNew + "</a>";
    } else {
      html += '<p><b>' + C.stepsTitle + '</b></p><ol class="steps">' + C.steps.map(function(s){ return "<li>" + s + "</li>"; }).join("") + "</ol>";
      html += '<button type="button" class="btn btn-light" data-act="copylist">' + C.copyList + "</button>";
    }
    html += "</section>";

    if (rest.length){
      html += '<section class="addons"><h4>' + C.alsoFits + '</h4><ul class="cats">';
      rest.forEach(function(r){
        var c = M.categories[r.key];
        html += '<li class="cat"><b>' + esc(c.name) + "</b><p>" + esc(c.blurb) + (c.note ? " " + esc(c.note) : "") + "</p>" +
                (r.why.length ? '<p class="why">' + C.fitsBecause + esc(listJoin(r.why)) + ".</p>" : "") + "</li>";
      });
      html += "</ul></section>";
    }
    if (notes.length) html += '<ul class="notes">' + notes.map(function(n){ return "<li>" + n + "</li>"; }).join("") + "</ul>";
    if (fresh) html += '<p class="secondary-cta"><a class="btn btn-primary" target="_top" rel="noopener" data-cta="signup" href="' + signupLink("bottom_" + top.key) + '">' + C.ctaNew + "</a></p>";
    html += '<div class="nav"><button type="button" class="btn btn-primary" data-act="back">← ' + C.back + '</button><div class="nav-right"><button type="button" class="btn btn-gray" data-act="restart">' + C.restart + "</button></div></div>";
    html += '<p class="fine">' + (fresh ? C.fine : C.fineTasker) + "</p>";
    app.innerHTML = html;
    app.dataset.list = [top].concat(rest).map(function(r){ return M.categories[r.key].name; }).join("\n");
    app.querySelector(".q-title").focus({ preventScroll: true });
    track("complete", { market: marketKey, tasker_status: answers.status, top: top.key, categories: [top].concat(rest).map(function(r){ return r.key; }).join(","), answers: JSON.stringify(answers) });
  }

  function copyList(btn){
    var text = app.dataset.list || "", label = btn.textContent;
    function done(){ btn.textContent = C.copied; setTimeout(function(){ btn.textContent = label; }, 1800); }
    function fallback(){ var ta = document.createElement("textarea"); ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0"; document.body.appendChild(ta); ta.select(); try { document.execCommand("copy"); } catch(e){} document.body.removeChild(ta); done(); }
    if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(text).then(done, fallback); else fallback();
    track("copy_list", { market: marketKey });
  }

  /* ---- events ---- */
  app.addEventListener("click", function(e){
    var b = e.target.closest("button, a"); if (!b) return;
    if (b.dataset.id) return choose(b.dataset.id);
    if (b.dataset.act === "next") return advance();
    if (b.dataset.act === "back"){
      if (!app.querySelector(".opt")) { current = history.pop(); renderQuestion(); post({ type: "step" }); return; }
      return back();
    }
    if (b.dataset.act === "restart") return restart();
    if (b.dataset.act === "copylist") return copyList(b);
    if (b.dataset.cta) track("signup_click", { market: marketKey, slot: (b.getAttribute("href").match(/utm_content=([^&]+)/) || [])[1] });
  });

  if (window.console) console.log("Taskrabbit Tasker quiz v" + CONFIG.version);
  renderQuestion();
})();
</script>
